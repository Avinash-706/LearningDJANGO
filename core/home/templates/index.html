<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS (for dropdowns, modals, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <h2>Hey This is a Nav Bar !!</h2>
    <nav>
        <a href="/home">Home</a></li>
        <a href="/success_page">Success</a></li>
        <a href="/contact">Contact Us</a></li>
    </nav>
    <br>

    <table class="table">
        <thead class="thead-dark">
            <tr>
                <th scope="col">S.No</th>
                <th scope="col">Name</th>
                <th scope="col">Age</th>
                <th scope="col">Can Vote ?</th>
            </tr>
        </thead>
        <tbody>
            {% for i in peoples %}
            <tr>
                <th scope="row">{{forloop.counter}}</th>
                <td>{{i.name}}</td>
                <td>{{i.age}}</td>
                <td>
                    {% if i.age >= 18 %}
                    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.gif" alt="👍" width="32"
                        height="32">
                    {% else %}
                        <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44e_1f3fe/512.gif" alt="👎" width="32" height="32" style="transform: scaleX(-1);">
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {{text|truncatechars:80}}


</body>

</html>
