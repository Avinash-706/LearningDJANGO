{% extends 'base.html' %}
{% block start %}

  <h2>Hey This is a Nav Bar !!</h2>
  <nav>
    <a href="/about">About</a> 
    <a href="/contact">Contact Us</a>
  </nav>
  <br />

  <table class="table">
    <thead class="thead-dark">
      <tr>
        <th scope="col">S.No</th>
        <th scope="col">Name</th>
        <th scope="col">Age</th>
        <th scope="col">Can Vote ?</th>
      </tr>
    </thead>
    <tbody>
      {% for i in peoples %}
        <tr>
          <th scope="row">{{ forloop.counter }}</th>
          <td>{{ i.name }}</td>
          <td>{{ i.age }}</td>
          <td>
            {% if i.age >= 18 %}
              <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.gif" alt="👍" width="32" height="32" />
            {% else %}
              <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44e_1f3fe/512.gif" alt="👎" width="32" height="32" style="transform: scaleX(-1);" />
            {% endif %}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  {{ text|truncatechars:80 }}
  
{% endblock %}
